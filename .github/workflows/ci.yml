name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: incidentdesk_test
          POSTGRES_USER: incidentdesk_test
          POSTGRES_PASSWORD: incidentdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentdesk_test -d incidentdesk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      INCIDENT_DESK_TEST_DATABASE_URL: postgresql://incidentdesk_test:incidentdesk_test@localhost:5432/incidentdesk_test
      INCIDENT_DESK_TEST_DATABASE_CONFIRM_ISOLATED: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project configuration
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew was not found. Add the Gradle Wrapper before enabling CI."
            exit 1
          fi

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Run tests and build
        run: xvfb-run --auto-servernum ./gradlew build

      - name: Preserve Linux test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test/
          retention-days: 7

  administrator-browser-tests:
    name: Administrator browser and accessibility suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: incidentdesk_e2e
          POSTGRES_USER: incidentdesk_e2e
          POSTGRES_PASSWORD: incidentdesk_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentdesk_e2e -d incidentdesk_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # An ephemeral service database: never a deployed or production target.
      INCIDENT_DESK_TEST_DATABASE_URL: postgresql://incidentdesk_e2e:incidentdesk_e2e@localhost:5432/incidentdesk_e2e
      INCIDENT_DESK_TEST_DATABASE_CONFIRM_ISOLATED: 'true'
      INCIDENT_DESK_E2E_SCHEMA: e2e_browser_suite

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Record the commit under verification
        run: 'echo "Browser evidence commit: $GITHUB_SHA"'

      - name: Run the administrator browser and accessibility suite
        run: ./gradlew administratorBrowserTest

      - name: Preserve browser and accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: administrator-browser-evidence-${{ github.sha }}
          path: |
            frontend/e2e-results/junit.xml
            frontend/e2e-results/html/
            frontend/e2e-results/artifacts/
          retention-days: 7

  attachment-platform-tests:
    name: Attachments and packaging (${{ matrix.os }}, ${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: x64
          - os: macos-latest
            architecture: arm64
          - os: macos-latest
            architecture: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          architecture: ${{ matrix.architecture }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify image attachments and storage
        shell: bash
        run: ./gradlew verifyJavaFxPlatforms verifyShadowJar test --tests '*Attachment*Test' --tests '*IncidentDeskApplicationTest' --tests '*PackagedApplicationTest'

      - name: Preserve attachment test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-${{ matrix.architecture }}
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test/
          retention-days: 7
