name: Deploy web application

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew
      - name: Verify frontend
        working-directory: frontend
        run: npm ci && npm run check && npm run build
      - name: Verify backend and assembled web artifact
        run: xvfb-run --auto-servernum ./gradlew build -PfrontendSkipBuild=true
      - name: Verify container can be built
        run: docker build --tag incident-desk:${{ github.sha }} .

  deploy:
    name: Deploy to Cloud Run
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate deployment configuration
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for name in \
            GCP_PROJECT_ID \
            GCP_REGION \
            GCP_ARTIFACT_REPOSITORY \
            CLOUD_RUN_SERVICE \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_DEPLOY_SERVICE_ACCOUNT \
            GCP_RUNTIME_SERVICE_ACCOUNT
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production environment variable: $name" >&2
              exit 1
            fi
          done
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - name: Build and publish immutable container
        id: image
        shell: bash
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${{ vars.CLOUD_RUN_SERVICE }}:${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
          digest="$(gcloud artifacts docker images describe "$IMAGE" --format='value(image_summary.digest)')"
          test -n "$digest"
          echo "uri=${IMAGE%:*}@$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy immutable revision
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --image "${{ steps.image.outputs.uri }}" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --service-account "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --allow-unauthenticated \
            --labels "managed-by=github-actions,commit-sha=${{ github.sha }}" \
            --quiet
          service_url="$(gcloud run services describe \
            "${{ vars.CLOUD_RUN_SERVICE }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format='value(status.url)')"
          test -n "$service_url"
          echo "url=$service_url" >> "$GITHUB_OUTPUT"
      - name: Verify deployed health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            "${{ steps.deploy.outputs.url }}/health")"
          jq -e '.status == "UP"' <<< "$response" >/dev/null
          echo "Verified health for commit ${{ github.sha }}"
