import org.gradle.internal.os.OperatingSystem
import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'application'
    id 'java'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.cs3227'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Used only to feed every platform's JavaFX natives into shadowJar (see
// below), never added to compile/test/run classpaths. Keeping platform
// classifiers off `implementation` matters: each javafx-graphics classifier
// ships an identically-named native loader class, and if more than one
// classifier is on the same resolvable classpath the JVM binds to whichever
// jar it resolves first and looks for THAT jar's natives, regardless of the
// host OS — breaking JavaFX Toolkit startup on every other platform.
configurations {
    shadowJavaFxNatives {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    shadowApplicationRuntime {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom runtimeClasspath
        exclude group: 'org.openjfx'
    }
    shadowMacArm64Natives {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

def javaFxPlatforms = [
    windows: [amd64: 'win', x86_64: 'win'],
    mac: [amd64: 'mac', x86_64: 'mac', aarch64: 'mac-aarch64', arm64: 'mac-aarch64'],
    linux: [amd64: 'linux', x86_64: 'linux', aarch64: 'linux-aarch64', arm64: 'linux-aarch64']
]
OperatingSystem hostOs = OperatingSystem.current()
String hostOsName = hostOs.isWindows() ? 'windows' : hostOs.isMacOsX() ? 'mac' : hostOs.isLinux() ? 'linux' : 'unsupported'
String hostArchitecture = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
String hostJavaFxPlatform = javaFxPlatforms[hostOsName]?.get(hostArchitecture)
if (hostJavaFxPlatform == null) {
    throw new GradleException("Unsupported JavaFX platform: ${hostOsName}/${hostArchitecture}. Use an x86_64 JDK 25, or an ARM64 JDK 25 on macOS/Linux.")
}

application {
    mainClass = 'com.company.incidentdesk.startup.IncidentDeskLauncher'
    // JavaFX loads native graphics libraries from the classpath, not the module path.
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

run {
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    String javaFxVersion = '25.0.2'
    List<String> javaFxModules = ['javafx-base', 'javafx-controls', 'javafx-fxml', 'javafx-graphics']

    // Compile/test/run only ever see the current build machine's classifier,
    // so there is exactly one native loader on those classpaths.
    javaFxModules.each { module ->
        implementation("org.openjfx:${module}:${javaFxVersion}:${hostJavaFxPlatform}") {
            // All four modules are explicit; POM defaults can reintroduce Intel natives.
            transitive = false
        }
        shadowMacArm64Natives("org.openjfx:${module}:${javaFxVersion}:mac-aarch64")
    }

    // The packaged shadow jar bundles JavaFX natives for win/mac/linux, all
    // x86_64; each platform's native library file name is distinct
    // (glass.dll / libglass.dylib / libglass.so), so merging them into one
    // jar does not collide, and the shipped jar resolves its own natives
    // relative to itself regardless of which OS launches it. JavaFX also
    // publishes mac-aarch64/linux-aarch64 classifiers, but those natives
    // share the SAME file names as their x86_64 counterparts, so a single
    // jar cannot hold both architectures for one OS; running on Apple
    // Silicon requires an x86_64 (Rosetta) JVM. See DeveloperGuide.md.
    ['win', 'mac', 'linux'].each { platform ->
        javaFxModules.each { module ->
            shadowJavaFxNatives("org.openjfx:${module}:${javaFxVersion}:${platform}")
        }
    }

    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    testLogging {
        exceptionFormat = 'full'
    }
}

tasks.register('previewAuthenticatedShell', JavaExec) {
    group = 'application'
    description = 'Launches the test-only administrator login and authenticated-shell preview.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.company.incidentdesk.ui.navigation.AuthenticatedShellPreview'
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def frontendDirectory = layout.projectDirectory.dir('frontend')
def frontendDistribution = frontendDirectory.dir('dist')
def frontendNpmCache = layout.projectDirectory.dir('.npm-cache')
def npmExecutable = OperatingSystem.current().isWindows() ? 'npm.cmd' : 'npm'
def skipFrontendBuild = providers.gradleProperty('frontendSkipBuild')
    .map { it.toBoolean() }
    .orElse(false)

def frontendInstall = tasks.register('frontendInstall', Exec) {
    group = 'build'
    description = 'Installs the locked React frontend dependencies.'
    workingDir frontendDirectory
    commandLine npmExecutable, 'ci', '--cache', frontendNpmCache.asFile.absolutePath
    inputs.files(frontendDirectory.file('package.json'), frontendDirectory.file('package-lock.json'))
    outputs.dir(frontendDirectory.dir('node_modules'))
    onlyIf { !skipFrontendBuild.get() }
}

def frontendBuild = tasks.register('frontendBuild', Exec) {
    group = 'build'
    description = 'Builds the production React assets served by Spring Boot.'
    dependsOn frontendInstall
    workingDir frontendDirectory
    commandLine npmExecutable, 'run', 'build'
    inputs.files(frontendDirectory.file('package.json'), frontendDirectory.file('package-lock.json'))
    inputs.dir(frontendDirectory.dir('src'))
    inputs.file(frontendDirectory.file('index.html'))
    inputs.file(frontendDirectory.file('tsconfig.json'))
    inputs.file(frontendDirectory.file('vite.config.ts'))
    outputs.dir(frontendDistribution)
    onlyIf { !skipFrontendBuild.get() }
}

def frontendCheck = tasks.register('frontendCheck', Exec) {
    group = 'verification'
    description = 'Runs frontend type, lint, and component checks.'
    dependsOn frontendInstall
    workingDir frontendDirectory
    commandLine npmExecutable, 'run', 'check'
    onlyIf { !skipFrontendBuild.get() }
}

tasks.named('processResources') {
    dependsOn frontendBuild
    from(frontendDistribution) {
        into 'static'
    }
}

tasks.named('check') {
    dependsOn frontendCheck
}

jar {
    // Only dependency-inclusive Shadow JARs are distributed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'incident-desk.jar'
    // Keep host-specific development natives out of the Intel-only distributable.
    configurations = [project.configurations.shadowApplicationRuntime, project.configurations.shadowJavaFxNatives]
    manifest {
        attributes(
            'Main-Class': application.mainClass.get(),
            'Enable-Native-Access': 'ALL-UNNAMED'
        )
    }
}

tasks.named('bootJar') {
    archiveFileName = 'incident-desk-web.jar'
    mainClass = 'com.company.incidentdesk.IncidentDeskWebApplication'
}

tasks.named('bootRun') {
    mainClass = 'com.company.incidentdesk.IncidentDeskWebApplication'
}

def shadowJarMacArm64 = tasks.register('shadowJarMacArm64', ShadowJar) {
    group = 'build'
    description = 'Builds the standalone Apple Silicon JAR for an ARM64 JDK 25.'
    archiveFileName = 'incident-desk-mac-aarch64.jar'
    from sourceSets.main.output
    configurations = [project.configurations.shadowApplicationRuntime, project.configurations.shadowMacArm64Natives]
    manifest {
        attributes(
            'Main-Class': application.mainClass.get(),
            'Enable-Native-Access': 'ALL-UNNAMED'
        )
    }
}

tasks.named('assemble') {
    dependsOn shadowJar, shadowJarMacArm64
}

// A test-only agent observes the real `java -jar` window and closes it.
// It supplies no JavaFX classes or application code to the packaged process.
def packagedStartupProbeJar = tasks.register('packagedStartupProbeJar', Jar) {
    dependsOn testClasses
    archiveFileName = 'packaged-startup-probe.jar'
    destinationDirectory = layout.buildDirectory.dir('test-support')
    from(sourceSets.test.output) {
        include 'com/company/incidentdesk/startup/PackagedStartupProbe.class'
    }
    manifest { attributes 'Premain-Class': 'com.company.incidentdesk.startup.PackagedStartupProbe' }
}

tasks.named('test') {
    dependsOn shadowJar, shadowJarMacArm64, packagedStartupProbeJar
    systemProperty 'incidentdesk.test.intelJar', tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath
    systemProperty 'incidentdesk.test.armJar', shadowJarMacArm64.get().archiveFile.get().asFile.absolutePath
    systemProperty 'incidentdesk.test.probeJar', packagedStartupProbeJar.get().archiveFile.get().asFile.absolutePath
    inputs.files(tasks.named('shadowJar'), shadowJarMacArm64, packagedStartupProbeJar)
}

def shadowJarOutputFile = layout.buildDirectory.file('libs/incident-desk.jar')

tasks.register('verifyShadowJar') {
    group = 'verification'
    description = 'Verifies the packaged shadow jar exists, declares the expected main class, and bundles JavaFX natives for Windows, macOS, and Linux.'
    dependsOn shadowJar
    inputs.file(shadowJarOutputFile)

    doLast {
        File jarFile = shadowJarOutputFile.get().asFile
        if (!jarFile.exists()) {
            throw new GradleException("Expected packaged jar not found at ${jarFile}")
        }

        new java.util.jar.JarFile(jarFile).withCloseable { jar ->
            String mainClass = jar.manifest?.mainAttributes?.getValue('Main-Class')
            String expectedMainClass = application.mainClass.get()
            if (mainClass != expectedMainClass) {
                throw new GradleException(
                    "Expected Main-Class '${expectedMainClass}' in ${jarFile} but found '${mainClass}'"
                )
            }

            Map<String, String> nativeMarkerByPlatform = [
                'Windows': 'glass.dll',
                'macOS'  : 'libglass.dylib',
                'Linux'  : 'libglass.so',
            ]
            nativeMarkerByPlatform.each { platform, marker ->
                if (jar.getEntry(marker) == null) {
                    throw new GradleException(
                        "Expected ${jarFile} to bundle the ${platform} JavaFX native '${marker}' but it was missing"
                    )
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn verifyShadowJar
}

tasks.register('verifyJavaFxPlatforms') {
    group = 'verification'
    description = 'Checks development and packaged JavaFX classifier isolation.'
    doLast {
        ['compileClasspath', 'runtimeClasspath', 'testRuntimeClasspath'].each { name ->
            def artifacts = configurations.getByName(name).resolvedConfiguration.resolvedArtifacts
                .findAll { it.moduleVersion.id.group == 'org.openjfx' }
            if (artifacts.size() != 4 || artifacts.any { it.classifier != hostJavaFxPlatform }) {
                throw new GradleException("${name} must contain exactly four JavaFX modules for ${hostJavaFxPlatform}: ${artifacts}")
            }
        }
        def packagedArtifacts = configurations.shadowJavaFxNatives.resolvedConfiguration.resolvedArtifacts
        if (packagedArtifacts.size() != 12 || packagedArtifacts.any { !(it.classifier in ['win', 'mac', 'linux']) }) {
            throw new GradleException('Packaged JavaFX dependencies must contain only the twelve x86_64 platform modules.')
        }
        def armArtifacts = configurations.shadowMacArm64Natives.resolvedConfiguration.resolvedArtifacts
        if (armArtifacts.size() != 4 || armArtifacts.any { it.classifier != 'mac-aarch64' }) {
            throw new GradleException('Apple Silicon packaging must contain only the four mac-aarch64 JavaFX modules.')
        }
        logger.lifecycle("Verified JavaFX development platform: ${hostJavaFxPlatform}; packaged platforms: win/mac/linux x86_64")
    }
}

tasks.named('check') {
    dependsOn verifyJavaFxPlatforms
}

// The distribution tasks create archives for local testing.
// Native .msi, .dmg, and .deb installers can be added later with jpackage.
